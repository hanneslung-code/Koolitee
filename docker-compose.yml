services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-replace-this-local-key-before-sharing}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      DB_PATH: /data/koolitee.sqlite3
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Koolitee kaaslane <teavitused@koolitee.local>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MODERATION_EMAIL: ${MODERATION_EMAIL:-}
    volumes:
      - koolitee_data:/data
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  koolitee_data:
